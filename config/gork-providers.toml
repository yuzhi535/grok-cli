# Managed by the local gcode multi-provider bridge. Keep credentials in
# environment variables, auth_provider helpers, or OpenCode/Codex/PI auth
# stores — do not put secrets in this file.

[endpoints]
# Optional dynamic catalog (OpenRouter). Per-model base_url entries below
# always take precedence for those models.
models_base_url = "https://openrouter.ai/api/v1"

# This distribution is a multi-provider client. Do not require a Grok/xAI
# browser session before starting; the selected model's own credential is used
# when a request is made instead.
[grok_com_config]
disable_grok_auth = true

[cli]
# The upstream auto-update endpoint is hosted at x.ai. Distribution updates are
# intentionally opt-in for this multi-provider build.
auto_update = false

[features]
# Disable the upstream model catalog and remote-settings fetches as well. Model
# definitions above and their own provider endpoints remain available.
remote_fetch = false

# ChatGPT / Codex OAuth — same client_id + refresh flow as PI.
# Helper reads ~/.codex/auth.json, ~/.pi/agent/auth.json, OpenCode auth.json.
[auth_provider.openai-codex]
command = "$HOME/.gcode/bin/gcode-openai-codex-auth"
token_ttl_secs = 3600
timeout_secs = 30

[models]
default = "openai-codex-gpt-5.4"

# PI openai-codex-responses: base is chatgpt.com/backend-api; the sampler
# rewrites the path to /codex/responses and injects chatgpt-account-id.
[model."openai-codex-gpt-5.4"]
model = "gpt-5.4"
base_url = "https://chatgpt.com/backend-api"
api_backend = "responses"
auth_provider = "openai-codex"
name = "OpenAI GPT-5.4 (ChatGPT OAuth)"
context_window = 272000

[model."openai-codex-gpt-5.4-mini"]
model = "gpt-5.4-mini"
base_url = "https://chatgpt.com/backend-api"
api_backend = "responses"
auth_provider = "openai-codex"
name = "OpenAI GPT-5.4 mini (ChatGPT OAuth)"
context_window = 272000

[model."openai-codex-gpt-5.6-terra"]
model = "gpt-5.6-terra"
base_url = "https://chatgpt.com/backend-api"
api_backend = "responses"
auth_provider = "openai-codex"
name = "OpenAI GPT-5.6 Terra (ChatGPT OAuth)"
context_window = 272000

# Anthropic remains available when ANTHROPIC_API_KEY is set, but is not the
# default provider. Change `model` when you choose a Claude version.
[model.anthropic-claude]
model = "claude-sonnet-4-5"
base_url = "https://api.anthropic.com/v1"
api_backend = "messages"
env_key = "ANTHROPIC_API_KEY"
name = "Anthropic Claude"
context_window = 200000

[model.deepseek-v4-pro]
model = "deepseek-v4-pro"
base_url = "https://api.deepseek.com/v1"
api_backend = "chat_completions"
env_key = "DEEPSEEK_API_KEY"
name = "DeepSeek V4 Pro"
context_window = 1000000

[model.deepseek-v4-flash]
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com/v1"
api_backend = "chat_completions"
env_key = "DEEPSEEK_API_KEY"
name = "DeepSeek V4 Flash"
context_window = 1000000

[model.kimi-k3]
model = "kimi-k3"
base_url = "https://api.moonshot.ai/v1"
api_backend = "chat_completions"
env_key = "MOONSHOT_API_KEY"
name = "Kimi K3"
context_window = 1000000

[model."kimi-k2.6"]
model = "kimi-k2.6"
base_url = "https://api.moonshot.ai/v1"
api_backend = "chat_completions"
env_key = "MOONSHOT_API_KEY"
name = "Kimi K2.6"
context_window = 256000
