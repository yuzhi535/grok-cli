name: Build & Release Gcode (CatPaw)

on:
  workflow_dispatch:
  push:
    branches: [catpaw-gork]
    tags:
      - "gcode-v*"
  pull_request:
    branches: [catpaw-gork]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: gcode

jobs:
  release-version:
    name: Derive Gcode release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/gcode-v* ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#gcode-v}"
          else
            version_file="crates/codegen/xai-grok-version/Cargo.toml"
            upstream_version="$(awk -F'"' '/^version = / { print $2; exit }' "$version_file")"
            core_version="${upstream_version%%-*}"
            IFS=. read -r major minor patch <<< "$core_version"
            version="${major}.${minor}.$((patch + 1))-gcode.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            tag="gcode-v${version}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Gcode release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.pretty_name }})
    needs: release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            pretty_name: macos-arm64

          # Linux (x86_64)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pretty_name: linux-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Rust toolchain version
        id: rust-toolchain
        run: |
          CHANNEL=$(grep '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1"
          key: ${{ matrix.target }}

      - name: Install protoc
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install protobuf
            echo "PROTOC=$(brew --prefix)/bin/protoc" >> $GITHUB_ENV
          else
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Build release binary
        env:
          GROK_VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          cargo build -p xai-grok-pager-bin --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p dist/lib/catpaw-gateway dist/share/gcode
          BIN="target/${{ matrix.target }}/release/${BINARY_NAME}"
          cp "$BIN" "dist/${BINARY_NAME}-core"
          cp catpaw-gateway/gcode-launcher.mjs "dist/${BINARY_NAME}"
          cp catpaw-gateway/gcode-update.mjs dist/gcode-update.mjs
          cp catpaw-gateway/*.mjs dist/lib/catpaw-gateway/
          cp catpaw-gateway/config.toml dist/share/gcode/managed_config.toml
          cat > dist/share/gcode/release.json <<JSON
          {
            "repository": "${GITHUB_REPOSITORY}",
            "tag": "${{ needs.release-version.outputs.tag }}",
            "version": "${{ needs.release-version.outputs.version }}",
            "commit": "${GITHUB_SHA}"
          }
          JSON
          chmod +x "dist/${BINARY_NAME}"
          # Strip debug symbols for smaller size (best-effort; may no-op for some targets)
          strip "dist/${BINARY_NAME}-core" || true

      - name: Verify binary
        run: |
          file "dist/${BINARY_NAME}-core" || true
          node --check "dist/${BINARY_NAME}"
          node --check dist/gcode-update.mjs
          node --test catpaw-gateway/test/*.test.mjs
          test_home="$(mktemp -d)"
          GCODE_HOME="$test_home" "./dist/${BINARY_NAME}" --version
          GCODE_HOME="$test_home" "./dist/${BINARY_NAME}" --version | grep -q '^gcode ${{ needs.release-version.outputs.version }} ('
          grep -q 'catpaw-gcode-managed' "$test_home/managed_config.toml"
          grep -q '"repository": "yuzhi535/gcode"' dist/share/gcode/release.json

      - name: Create archive
        run: |
          cd dist
          tar -czvf "../${BINARY_NAME}-${{ matrix.pretty_name }}.tar.gz" .
          cd ..
          if command -v sha256sum >/dev/null; then
            sha256sum "${BINARY_NAME}-${{ matrix.pretty_name }}.tar.gz" \
              > "${BINARY_NAME}-${{ matrix.pretty_name }}.tar.gz.sha256"
          else
            shasum -a 256 "${BINARY_NAME}-${{ matrix.pretty_name }}.tar.gz" \
              > "${BINARY_NAME}-${{ matrix.pretty_name }}.tar.gz.sha256"
          fi
          ls -lh "${BINARY_NAME}-${{ matrix.pretty_name }}.tar.gz"

      - name: Upload build artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.pretty_name }}
          path: |
            ${{ env.BINARY_NAME }}-${{ matrix.pretty_name }}.tar.gz
            ${{ env.BINARY_NAME }}-${{ matrix.pretty_name }}.tar.gz.sha256
          retention-days: 14

  publish-tag-release:
    name: Publish tagged Release
    runs-on: ubuntu-latest
    needs: [release-version, build]
    permissions:
      contents: write
    if: >
      always()
      && startsWith(github.ref, 'refs/tags/')
      && needs.build.result != 'cancelled'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BINARY_NAME }}-*
          path: artifacts
          merge-multiple: true

      - name: Publish tagged release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/${BINARY_NAME}-*.tar.gz artifacts/${BINARY_NAME}-*.tar.gz.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No build artifacts found — nothing to publish."
            exit 1
          fi

          bash scripts/generate-release-notes.sh \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${GITHUB_REPOSITORY}" artifacts release-notes.md

          gh release create "${{ needs.release-version.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "gcode ${GITHUB_REF_NAME}" \
            --notes "$(<release-notes.md)" \
            --generate-notes \
            "${files[@]}"

  # Every successful push to catpaw-gork gets an immutable prerelease. This preserves
  # prior artifacts instead of deleting and replacing a rolling `latest` tag.
  publish-main-prerelease:
    name: Publish immutable prerelease (catpaw-gork)
    runs-on: ubuntu-latest
    needs: [release-version, build]
    permissions:
      contents: write
    if: >
      github.ref == 'refs/heads/catpaw-gork'
      && github.event_name == 'push'
      && needs.build.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BINARY_NAME }}-*
          path: artifacts
          merge-multiple: true

      - name: Publish immutable prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(artifacts/${BINARY_NAME}-*.tar.gz artifacts/${BINARY_NAME}-*.tar.gz.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No build artifacts found — nothing to publish."
            exit 1
          fi

          echo "Found ${#files[@]} artifact(s):"
          ls -lh "${files[@]}"

          tag="${{ needs.release-version.outputs.tag }}"
          echo "Publishing immutable prerelease ${tag}..."

          bash scripts/generate-release-notes.sh \
            "${tag}" "${GITHUB_SHA}" "${GITHUB_REPOSITORY}" artifacts release-notes.md

          gh release create "${tag}" \
            --repo "${{ github.repository }}" \
            --title "gcode ${tag}" \
            --notes-file release-notes.md \
            --prerelease \
            --target "${{ github.sha }}" \
            "${files[@]}"

          echo "✅ Published ${tag} with ${#files[@]} artifact(s)."
