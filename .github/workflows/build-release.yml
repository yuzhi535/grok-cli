name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

# contents:write is required to create/update GitHub Releases.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: gcode

jobs:
  build:
    name: Build (${{ matrix.pretty_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            pretty_name: macos-arm64

          # Linux (x86_64)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pretty_name: linux-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Rust toolchain version
        id: rust-toolchain
        run: |
          CHANNEL=$(grep '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1"
          key: ${{ matrix.target }}

      - name: Install protoc
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install protobuf
            echo "PROTOC=$(brew --prefix)/bin/protoc" >> $GITHUB_ENV
          else
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Build release binary
        run: |
          cargo build -p xai-grok-pager-bin --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/${BINARY_NAME}"
          cp "$BIN" "dist/${BINARY_NAME}"
          chmod +x "dist/${BINARY_NAME}"
          # Strip debug symbols for smaller size (best-effort; may no-op for some targets)
          strip "dist/${BINARY_NAME}" || true

      - name: Verify binary
        run: |
          file "dist/${BINARY_NAME}" || true
          "./dist/${BINARY_NAME}" --version || true

      - name: Create archive
        run: |
          cd dist
          tar -czvf "../${BINARY_NAME}-${{ matrix.pretty_name }}.tar.gz" "${BINARY_NAME}"
          cd ..
          if command -v sha256sum >/dev/null; then
            sha256sum "${BINARY_NAME}-${{ matrix.pretty_name }}.tar.gz" \
              > "${BINARY_NAME}-${{ matrix.pretty_name }}.tar.gz.sha256"
          else
            shasum -a 256 "${BINARY_NAME}-${{ matrix.pretty_name }}.tar.gz" \
              > "${BINARY_NAME}-${{ matrix.pretty_name }}.tar.gz.sha256"
          fi
          ls -lh "${BINARY_NAME}-${{ matrix.pretty_name }}.tar.gz"

      - name: Upload build artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.pretty_name }}
          path: |
            ${{ env.BINARY_NAME }}-${{ matrix.pretty_name }}.tar.gz
            ${{ env.BINARY_NAME }}-${{ matrix.pretty_name }}.tar.gz.sha256
          retention-days: 14

  publish-tag-release:
    name: Publish tagged Release
    runs-on: ubuntu-latest
    needs: build
    if: >
      always()
      && startsWith(github.ref, 'refs/tags/')
      && needs.build.result != 'cancelled'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BINARY_NAME }}-*
          path: artifacts
          merge-multiple: true

      - name: Publish tagged release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/${BINARY_NAME}-*.tar.gz artifacts/${BINARY_NAME}-*.tar.gz.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No build artifacts found — nothing to publish."
            exit 1
          fi

          bash scripts/generate-release-notes.sh \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${GITHUB_REPOSITORY}" artifacts release-notes.md

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "gcode ${GITHUB_REF_NAME}" \
            --notes "$(<release-notes.md)" \
            --generate-notes \
            "${files[@]}"

  # Every successful push to main gets an immutable prerelease. This preserves
  # prior artifacts instead of deleting and replacing a rolling `latest` tag.
  publish-main-prerelease:
    name: Publish immutable prerelease (main)
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs.build.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive immutable prerelease version
        id: version
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="v0.0.0-dev.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.${short_sha}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BINARY_NAME }}-*
          path: artifacts
          merge-multiple: true

      - name: Publish immutable prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(artifacts/${BINARY_NAME}-*.tar.gz artifacts/${BINARY_NAME}-*.tar.gz.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No build artifacts found — nothing to publish."
            exit 1
          fi

          echo "Found ${#files[@]} artifact(s):"
          ls -lh "${files[@]}"

          tag="${{ steps.version.outputs.tag }}"
          echo "Publishing immutable prerelease ${tag}..."

          bash scripts/generate-release-notes.sh \
            "${tag}" "${GITHUB_SHA}" "${GITHUB_REPOSITORY}" artifacts release-notes.md

          gh release create "${tag}" \
            --repo "${{ github.repository }}" \
            --title "gcode ${tag}" \
            --notes-file release-notes.md \
            --prerelease \
            --target "${{ github.sha }}" \
            "${files[@]}"

          echo "✅ Published ${tag} with ${#files[@]} artifact(s)."
