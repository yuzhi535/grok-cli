name: Sync main to CatPaw Gork

on:
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: sync-main-to-catpaw-gork
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    name: Prepare CatPaw sync PR
    if: >
      vars.UPSTREAM_SYNC_ENABLED == 'true'
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Require dedicated automation token
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [[ -z "$UPSTREAM_SYNC_TOKEN" ]]; then
            echo "::error::UPSTREAM_SYNC_TOKEN is missing. Use a dedicated fine-grained token; do not reuse a personal gh token."
            exit 1
          fi

      - name: Checkout CatPaw branch
        uses: actions/checkout@v4
        with:
          ref: catpaw-gork
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Configure sync identity
        run: |
          git config user.name "gcode-upstream-sync[bot]"
          git config user.email "gcode-upstream-sync[bot]@users.noreply.github.com"

      - name: Prepare merge branch
        id: sync
        env:
          SOURCE_REMOTE: origin
          SOURCE_BRANCH: main
          TARGET_BRANCH: catpaw-gork
          SYNC_BRANCH_PREFIX: automation/catpaw-gork
          SYNC_COMMIT_PREFIX: "Sync gcode main into CatPaw Gork"
          REVIEW_REGEX: '^\.github/workflows/build-release\.yml$|^README\.md$|(^|/)(auth|oauth|sampler|acp|updater)(/|\.|$)|(^|/)paths\.rs$|xai-grok-home|xai-grok-pager-bin/Cargo\.toml|pty|test_env'
        run: bash scripts/github/prepare-branch-sync.sh

      - name: Report no update
        if: steps.sync.outputs.status == 'no_update'
        run: echo "catpaw-gork already contains main ${{ steps.sync.outputs.source_sha }}"

      - name: Create or update conflict issue
        if: steps.sync.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          SOURCE_SHA: ${{ steps.sync.outputs.source_sha }}
          TARGET_SHA: ${{ steps.sync.outputs.target_sha }}
          CONFLICT_PATHS: ${{ steps.sync.outputs.conflict_paths }}
        run: |
          set -euo pipefail
          gh label create upstream-sync --repo "$GITHUB_REPOSITORY" --color 1d76db --description "Automated upstream synchronization" --force
          gh label create needs-manual-review --repo "$GITHUB_REPOSITORY" --color d93f0b --description "Automation stopped for manual review" --force

          short_sha="${SOURCE_SHA:0:12}"
          title="CatPaw branch sync conflict at ${short_sha}"
          body_file="$RUNNER_TEMP/catpaw-sync-issue.md"
          {
            echo "Merging \`main@${SOURCE_SHA}\` into \`catpaw-gork@${TARGET_SHA}\` produced conflicts."
            echo
            echo '```text'
            printf '%s\n' "$CONFLICT_PATHS"
            echo '```'
          } > "$body_file"

          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label upstream-sync --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file" --label upstream-sync,needs-manual-review
          fi

      - name: Open CatPaw sync pull request
        if: steps.sync.outputs.status == 'pushed'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          SYNC_BRANCH: ${{ steps.sync.outputs.sync_branch }}
          SOURCE_SHA: ${{ steps.sync.outputs.source_sha }}
          TARGET_SHA: ${{ steps.sync.outputs.target_sha }}
          REVIEW_PATHS: ${{ steps.sync.outputs.review_paths }}
        run: |
          set -euo pipefail
          gh label create upstream-sync --repo "$GITHUB_REPOSITORY" --color 1d76db --description "Automated upstream synchronization" --force
          gh label create needs-manual-review --repo "$GITHUB_REPOSITORY" --color d93f0b --description "Automation stopped for manual review" --force

          body_file="$RUNNER_TEMP/catpaw-sync-pr.md"
          {
            echo "Synchronizes \`catpaw-gork\` with verified \`main@${SOURCE_SHA}\`."
            echo
            echo "CatPaw base before merge: \`${TARGET_SHA}\`"
            if [[ -n "$REVIEW_PATHS" ]]; then
              echo
              echo "CatPaw-owned or sensitive paths changed; this PR requires manual review:"
              echo '```text'
              printf '%s\n' "$REVIEW_PATHS"
              echo '```'
            else
              echo
              echo "No configured CatPaw-owned paths changed. Required checks may auto-merge this PR."
            fi
          } > "$body_file"

          pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" --base catpaw-gork --head "$SYNC_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$pr_url" ]]; then
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base catpaw-gork --head "$SYNC_BRANCH" --title "Sync main into CatPaw Gork ${SOURCE_SHA:0:12}" --body-file "$body_file" --label upstream-sync)"
          fi

          if [[ -n "$REVIEW_PATHS" ]]; then
            gh pr edit "$pr_url" --repo "$GITHUB_REPOSITORY" --add-label needs-manual-review
          else
            gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --auto --merge
          fi
