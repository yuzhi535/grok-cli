# catpaw-gcode-managed
# Gcode is the harness. CatPaw supplies model inference only through the local
# loopback gateway; no CatPaw credential is stored in this file.

[cli]
auto_update = false

[features]
remote_fetch = false

[models]
default = "catpaw-gpt-5.6-sol"
allowed_models = ["catpaw-*"]

[model."catpaw-gpt-5.6-sol"]
model = "catpaw-gpt-5.6-sol"
base_url = "http://127.0.0.1:18765/v1"
api_backend = "chat_completions"
env_key = "CATPAW_GCODE_LOCAL_TOKEN"
name = "CatPaw GPT-5.6 Sol"
context_window = 200000

